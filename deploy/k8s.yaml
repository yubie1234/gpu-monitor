# gpu-monitor in-cluster 배포 매니페스트
#
# 전제: 이미지가 레지스트리(10.92.20.77:5002)에 올라가 있어야 한다.
#   ./ci.sh && ./push.sh
#   # imagePullPolicy: Always 라 :latest 최신본을 매번 받는다.
#   # HTTP(비TLS) 레지스트리면 노드 containerd 에 insecure-registry(10.92.20.77:5002) 설정 필요.
# 적용:
#   kubectl apply -f deploy/k8s.yaml
#
# 이 앱은 "할당(allocation)"만 본다 — Pod resources.limits/requests 의 nvidia.com/gpu 수.
# DCGM 류 실사용률(%, VRAM, 온도)은 다루지 않는다. 그래서 필요한 RBAC 도 nodes/pods 읽기뿐.
---
apiVersion: v1
kind: Namespace
metadata:
  name: dashboard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-monitor
  namespace: dashboard
---
# 필요한 최소 권한(읽기 전용, cluster-scope).
#   - nodes: GPU capacity/allocatable(status) + 장치명(라벨 nvidia.com/gpu.product)
#   - pods : 노드별 GPU 점유(spec.containers[].resources[nvidia.com/gpu]) 집계
# 앱은 fieldSelector=spec.nodeName 로 노드별 Pod 를 조회하므로 pods 는 전 네임스페이스 list 가 필요.
# verbs 는 'list' 만 준다 — 앱은 컬렉션 조회(GET /api/v1/nodes, /api/v1/pods?fieldSelector)만
# 하고 개별 리소스 get(.../<name>)은 하지 않으므로 'get' 은 불필요(최소권한).
# ⚠ 이 ClusterRole/Binding 이 없거나 pruned 되면: SA 토큰은 automount 되어 앱은 'k8s 활성'으로
#   뜨지만 nodes/pods 조회가 403 → 스냅샷은 빈 데이터로 생성되고 /readyz 는 200(ready)으로 남는다
#   (인증 실패가 probe 로 안 드러남). 403 은 /api/snapshot 의 errors[] 에만 보인다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-monitor-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-monitor-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gpu-monitor-reader
subjects:
  - kind: ServiceAccount
    name: gpu-monitor
    namespace: dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-monitor
  namespace: dashboard
  labels:
    app: gpu-monitor
    app.kubernetes.io/name: gpu-monitor
    app.kubernetes.io/version: "0.1.1"   # app/__init__.py __version__ 과 맞출 것
spec:
  # replicas:1 — 모니터라 단일 인스턴스 수용(HA 아님). 노드 드레인/축출 시 재스케줄 +
  # startupProbe 첫 수집(최대 300s) 동안 대시보드/metrics 공백. PDB 는 replicas:1 에선 무의미해 생략.
  replicas: 1
  selector:
    matchLabels: { app: gpu-monitor }
  template:
    metadata:
      labels:
        app: gpu-monitor
        app.kubernetes.io/name: gpu-monitor
        app.kubernetes.io/version: "0.1.1"
    spec:
      serviceAccountName: gpu-monitor
      containers:
        - name: gpu-monitor
          # ci.sh 로 빌드 -> push.sh 로 레지스트리에 올린 이미지.
          # ENTRYPOINT 가 uvicorn app.main:app --port 8089 로 포트를 고정하므로(Dockerfile),
          # 컨테이너에서 MONITOR_PORT/MONITOR_HOST env 는 무시된다 — 포트는 8089 고정.
          #
          # ⚠ 태그 주의: :latest 는 product 라인에서만 만들어진다. ci.sh/push.sh 는 BRANCH
          #   미지정/product 일 때만 :latest 를, develop/feature 라인은 :<version>-<branch>
          #   (예: :0.1.0-develop, :0.1.0-feature-...)만 만든다(CLAUDE.md 브랜치 태그 전략).
          #   → develop/feature 빌드를 배포하려면 이 image 를 그 브랜치 태그로 바꿀 것.
          #     그대로 :latest 를 쓰면 방금 올린 코드가 아니라 마지막 product :latest(다른 코드)
          #     를 받거나, product 미푸시면 ImagePullBackOff 가 된다.
          #   재현/롤백이 필요하면 불변 태그(:<version>-<branch>) 또는 @sha256 digest 로 pin 하고
          #   imagePullPolicy 를 IfNotPresent 로 바꾼다.
          image: 10.92.20.77:5002/ai-tool/gpu-monitor:latest
          imagePullPolicy: Always   # :latest(product floating)라 매번 최신본 pull
          env:
            # 백그라운드 수집 주기(초). 할당은 급변하지 않으니 15~30s 권장.
            - { name: MONITOR_INTERVAL, value: "15" }
            # GPU 노드만 조회하도록 서버측 필터(선택). GFD/GPU Operator 라벨 예시.
            # 미설정이면 전체 노드를 받아 capacity>0 노드만 남긴다.
            # - { name: MONITOR_NODE_SELECTOR, value: "nvidia.com/gpu.present=true" }
            # path prefix 뒤 노출(아래 Ingress 와 동일 prefix). 루트로 쓰려면 이 줄 제거.
            - { name: MONITOR_ROOT_PATH, value: "/service/gpu-monitor" }
          ports:
            - { containerPort: 8089, name: http }
          # startupProbe: lifespan 이 "첫 수집 완료"까지 서버 기동을 블록한다
          #   (app/services/state.py:start -> _refresh_once 를 await). 대형 클러스터에서
          #   첫 수집은 노드 수 × per-node Pod 조회라 수십 초~수 분이 걸릴 수 있는데,
          #   그동안 HTTP 서버가 리슨하지 않으므로 liveness 가 곧장 실패해 죽는 것을 막는다.
          #   periodSeconds×failureThreshold = 최대 대기( 5s×60 = 5분 ) 안에 첫 수집이
          #   끝나면 정상. 노드가 매우 많으면 failureThreshold 를 올릴 것.
          startupProbe:
            httpGet: { path: /healthz, port: 8089 }
            periodSeconds: 5
            failureThreshold: 60
          # readiness: 첫 스냅샷이 생겨야 200(/readyz). 그전엔 503 → 트래픽 차단.
          readinessProbe:
            httpGet: { path: /readyz, port: 8089 }
            periodSeconds: 10
          # liveness: 프로세스 생존만 확인(/healthz 는 항상 200). startupProbe 성공 후 시작.
          livenessProbe:
            httpGet: { path: /healthz, port: 8089 }
            periodSeconds: 20
          resources:
            # 스냅샷 하나에 전체 노드 + GPU 점유 Pod 를 담는다. 노드/Pod 가 수백~수천이면
            # 메모리 상한을 올릴 것(응답 JSON 이 커진다). CPU 는 폴링 위주라 낮아도 됨.
            requests: { cpu: "50m", memory: "96Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile: { type: RuntimeDefault }   # restricted PodSecurity 준수
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            # readOnlyRootFilesystem:true 하에 쓰기 가능한 /tmp 확보(향후 의존성이 임시파일을
            # 쓰더라도 안전). 현재 앱은 런타임 파일 쓰기가 없어 없어도 동작하지만 방어적으로 둔다.
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-monitor
  namespace: dashboard
spec:
  selector: { app: gpu-monitor }
  ports:
    - { port: 80, targetPort: 8089, name: http }
---
# path prefix 뒤로 노출: http(s)://<any-host>/service/gpu-monitor  (host 미지정 = 모든 도메인)
#
# 동작: nginx ingress 가 prefix(/service/gpu-monitor)를 rewrite 로 떼고 앱(루트)에 전달한다.
#       앱은 MONITOR_ROOT_PATH 로 같은 prefix 를 알고 있어, 대시보드 자기 호출(fetch
#       /api/snapshot 등)에 prefix 를 붙인다 -> 브라우저가 <host>/service/gpu-monitor/...
#       로 요청 -> ingress 가 다시 떼어 앱에 전달.
#
# 전제: nginx ingress controller. 다른 컨트롤러면 rewrite 주석/문법을 맞게 바꿀 것.
#   - host 미지정이라 모든 도메인을 받는다. 특정 도메인만 받으려면 rules 에 host: 추가.
#   - ingressClassName(nginx) 은 실제 환경 값으로 교체.
#   - TLS 를 쓰면 spec.tls 블록 추가.
# ⚠ 보안: 이 Ingress 는 대시보드뿐 아니라 /api/snapshot·/metrics 까지 무인증으로 노출한다
#   (앱에 인증 없음). 민감하면 도메인/경로 제한·인증 프록시를 두거나 내부 전용으로 둘 것.
#   NetworkPolicy 는 Pod 직접 접근만 막고 이 Ingress 경로는 못 막는다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gpu-monitor
  namespace: dashboard
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /service/gpu-monitor(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: gpu-monitor
                port:
                  number: 80
# TLS 예시(인증서 Secret 준비 후 주석 해제):
# spec:
#   tls:
#     - hosts: [<도메인>]
#       secretName: gpu-monitor-tls
#
# 참고: PodMonitor(kube-prometheus-stack 스크레이프)는 deploy/podmonitor.yaml 로 분리했다.
#   monitoring.coreos.com CRD 가 없으면 apply 가 비-0 종료코드를 내므로, CRD 의존이 없는
#   core 매니페스트(이 파일)와 나눠 Operator 가 있을 때만 별도로 apply 한다.
